<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>浏览器环境与篡改检测</title>
    <style>
        :root {
            --primary: #0f172a;
            --pass-bg: #ecfdf5;
            --pass-text: #065f46;
            --warn-bg: #fff7ed;
            --warn-text: #9a3412;
            --fail-bg: #fef2f2;
            --fail-text: #991b1b;
            --info-bg: #f0f9ff;
            --info-text: #075985;
            --surface: #ffffff;
            --border: #e2e8f0;
            --accent: #3b82f6;
            --bg: #f1f5f9;
            --text: #1e293b;
            --text-secondary: #64748b;
            --text-tertiary: #475569;
            --surface-secondary: #f8fafc;
            --surface-hover: #fafbfc;
            --ua-hover: #eef2f6;
            --border-light: #e8ecf1;
            --table-border: #f1f5f9;
            --shadow-sm: rgba(0,0,0,0.03);
            --shadow-md: rgba(0,0,0,0.04);
            --shadow-lg: rgba(0,0,0,0.08);
        }
        :root[data-theme="dark"] {
            --primary: #e2e8f0;
            --pass-bg: #022c22;
            --pass-text: #6ee7b7;
            --warn-bg: #431407;
            --warn-text: #fdba74;
            --fail-bg: #450a0a;
            --fail-text: #fca5a5;
            --info-bg: #0c1929;
            --info-text: #7dd3fc;
            --surface: #1e293b;
            --border: #334155;
            --accent: #60a5fa;
            --bg: #0f172a;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-tertiary: #94a3b8;
            --surface-secondary: #1e293b;
            --surface-hover: #283548;
            --ua-hover: #283548;
            --border-light: #334155;
            --table-border: #1e293b;
            --shadow-sm: rgba(0,0,0,0.2);
            --shadow-md: rgba(0,0,0,0.3);
            --shadow-lg: rgba(0,0,0,0.4);
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --primary: #e2e8f0;
                --pass-bg: #022c22;
                --pass-text: #6ee7b7;
                --warn-bg: #431407;
                --warn-text: #fdba74;
                --fail-bg: #450a0a;
                --fail-text: #fca5a5;
                --info-bg: #0c1929;
                --info-text: #7dd3fc;
                --surface: #1e293b;
                --border: #334155;
                --accent: #60a5fa;
                --bg: #0f172a;
                --text: #e2e8f0;
                --text-secondary: #94a3b8;
                --text-tertiary: #94a3b8;
                --surface-secondary: #1e293b;
                --surface-hover: #283548;
                --ua-hover: #283548;
                --border-light: #334155;
                --table-border: #1e293b;
                --shadow-sm: rgba(0,0,0,0.2);
                --shadow-md: rgba(0,0,0,0.3);
                --shadow-lg: rgba(0,0,0,0.4);
            }
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            margin: 0; padding: 16px;
            color: var(--text); line-height: 1.5;
            -webkit-text-size-adjust: 100%;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .page-header { margin-bottom: 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
        .page-header .header-left { flex: 1; }
        .page-header h1 { font-size: 1.5rem; color: var(--primary); margin: 0 0 4px 0; letter-spacing: -0.02em; }
        .page-header .sub { color: var(--text-secondary); font-size: 0.85rem; border-left: 4px solid var(--accent); padding-left: 12px; }

        .ua-display-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 14px; padding: 16px; margin-bottom: 18px;
            box-shadow: 0 2px 8px var(--shadow-md); display: flex; flex-wrap: wrap;
            align-items: flex-start; gap: 12px; transition: border-color 0.2s;
        }
        .ua-label-row { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .ua-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .ua-meta { display: flex; flex-direction: column; gap: 2px; }
        .ua-meta .ua-title { font-weight: 700; font-size: 0.8rem; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.04em; }
        .ua-meta .ua-browser-tag { font-size: 0.75rem; color: var(--text-secondary); background: var(--surface-secondary); padding: 2px 10px; border-radius: 20px; border: 1px solid var(--border); display: inline-block; width: fit-content; white-space: nowrap; }
        .ua-full-string {
            flex: 1; min-width: 220px; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.7rem; color: var(--text); background: var(--surface-secondary); padding: 10px 12px;
            border-radius: 8px; word-break: break-all; border: 1px solid var(--border-light); line-height: 1.5;
            position: relative; cursor: pointer; transition: background 0.15s; user-select: all;
        }
        .ua-full-string:hover { background: var(--ua-hover); }
        .ua-full-string::after {
            content: '📋 点击复制'; position: absolute; top: 8px; right: 10px;
            font-size: 0.65rem; color: var(--text-secondary); font-family: system-ui, sans-serif;
            pointer-events: none; opacity: 0; transition: opacity 0.2s;
        }
        .ua-full-string:hover::after { opacity: 1; }
        .ua-copied-toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #0f172a; color: #fff; padding: 10px 22px; border-radius: 30px;
            font-size: 0.85rem; z-index: 999; pointer-events: none; opacity: 0;
            transition: opacity 0.3s; box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }
        .ua-copied-toast.show { opacity: 1; }

        .summary {
            border-radius: 16px; padding: 20px; margin-bottom: 22px;
            display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
            gap: 12px; box-shadow: 0 8px 20px var(--shadow-lg); color: #fff; transition: background-color 0.4s;
        }
        .summary .verdict { font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .summary .verdict .emoji { font-size: 1.4rem; flex-shrink: 0; }
        .summary .detail-row { display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.8rem; opacity: 0.9; align-items: center; }
        .summary .highlight-real { background: rgba(255,255,255,0.2); padding: 3px 10px; border-radius: 20px; font-weight: 700; backdrop-filter: blur(4px); white-space: nowrap; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
        .card { background: var(--surface); border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 2px 6px var(--shadow-sm); overflow: hidden; transition: box-shadow 0.2s; }
        .card-header { background: var(--surface-secondary); padding: 10px 14px; font-weight: 700; font-size: 0.9rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; }
        .card-body { padding: 0; }
        table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
        tr { border-bottom: 1px solid var(--table-border); }
        tr:last-child { border-bottom: none; }
        tr:hover { background: var(--surface-hover); }
        td { padding: 10px 12px; vertical-align: top; }
        td:first-child { font-weight: 600; width: 36%; color: var(--text-tertiary); font-size: 0.75rem; word-break: break-word; }
        td:last-child { word-break: break-word; }

        .badge { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 0.65rem; font-weight: 700; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.03em; }
        .badge.pass { background: var(--pass-bg); color: var(--pass-text); border: 1px solid #a7f3d0; }
        .badge.warn { background: var(--warn-bg); color: var(--warn-text); border: 1px solid #fed7aa; }
        .badge.fail { background: var(--fail-bg); color: var(--fail-text); border: 1px solid #fecaca; }
        .badge.info { background: var(--info-bg); color: var(--info-text); border: 1px solid #bae6fd; }
        .reason { display: block; font-size: 0.7rem; color: var(--text-secondary); margin-top: 4px; line-height: 1.4; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .grid { grid-template-columns: 1fr; }
            .ua-display-card { flex-direction: column; }
            .summary { flex-direction: column; align-items: flex-start; }
            .ua-full-string { font-size: 0.65rem; }
            td:first-child { width: 40%; }
        }

        .theme-toggle {
            flex-shrink: 0; width: 40px; height: 40px; border-radius: 10px;
            border: 1px solid var(--border); background: var(--surface);
            cursor: pointer; font-size: 1.1rem; display: flex; align-items: center;
            justify-content: center; transition: background 0.2s, border-color 0.2s;
            color: var(--text); line-height: 1;
        }
        .theme-toggle:hover { background: var(--surface-hover); border-color: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <div class="header-left">
                <h1>浏览器指纹与防伪装分析</h1>
                <div class="sub">融合底层引擎、Client Hints、WebGL 渲染指纹 — 识别 UA 与操作系统伪装</div>
            </div>
            <button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换深色/浅色模式">🌓</button>
        </div>

        <div class="ua-display-card" id="uaCard">
            <div class="ua-label-row">
                <div class="ua-icon">🧬</div>
                <div class="ua-meta">
                    <span class="ua-title">当前 User-Agent</span>
                    <span class="ua-browser-tag" id="uaClaimedTag">解析中...</span>
                </div>
            </div>
            <div class="ua-full-string" id="uaFullString" title="点击复制 UA 字符串">读取中...</div>
        </div>

        <div class="summary" id="summaryArea">
            <div class="verdict"><span class="emoji">⏳</span> 环境扫描中...</div>
        </div>

        <div class="grid" id="detectionGrid"></div>
    </div>
    <div class="ua-copied-toast" id="uaToast">✅ UA 已复制到剪贴板</div>

    <script>
        (function() {
            const THEME_KEY = 'bdp-theme';
            const html = document.documentElement;
            const toggleBtn = document.getElementById('themeToggle');

            function getTheme() { return localStorage.getItem(THEME_KEY) || 'auto'; }
            function setTheme(theme) {
                localStorage.setItem(THEME_KEY, theme);
                if (theme === 'auto') html.removeAttribute('data-theme');
                else html.setAttribute('data-theme', theme);
                updateToggleIcon(theme);
            }
            function updateToggleIcon(theme) {
                const icons = { auto: '🌓', dark: '🌙', light: '☀️' };
                toggleBtn.textContent = icons[theme] || '🌓';
            }

            const saved = getTheme();
            if (saved === 'auto') html.removeAttribute('data-theme');
            else html.setAttribute('data-theme', saved);
            updateToggleIcon(saved);

            toggleBtn.addEventListener('click', () => {
                const cycle = { auto: 'dark', dark: 'light', light: 'auto' };
                setTheme(cycle[getTheme()]);
            });

            let results = [];
            let interactData = { mouse: false, click: false, scroll: false };
            let inferenceData = null;
            let realBrowserEvidence = {
                hasChromeObject: false, hasGeckoCSS: false, isV8Stack: false,
                isSpiderMonkeyStack: false, clientHintsBrands: [], clientHintsPlatform: '',
                hasSoftwareRenderer: false, isWebdriver: false, rendererDetail: '',
            };

            function addResult(category, name, value, status, reason) {
                results.push({ category, name, value, status, reason });
            }

            function isNativeSupport(obj, prop) {
                try {
                    if (!obj || !(prop in obj)) return false;
                    const val = obj[prop];
                    if (typeof val === 'function') return /\{\s*\[native code\]\s*\}/.test(val.toString());
                    return true;
                } catch (e) { return false; }
            }

            function inferRealBrowser(claimed, ua) {
                let candidates = [];
                if (realBrowserEvidence.clientHintsBrands.length > 0) {
                    const brandsLower = realBrowserEvidence.clientHintsBrands.map(b => b.toLowerCase());
                    if (brandsLower.some(b => b.includes('microsoft edge') || b.includes('edge'))) candidates.push({ browser: 'Edge', weight: 95, source: 'Client Hints 品牌标识' });
                    if (brandsLower.some(b => b.includes('google chrome') && !b.includes('chromium'))) candidates.push({ browser: 'Chrome', weight: 90, source: 'Client Hints 品牌标识' });
                    if (brandsLower.some(b => b.includes('brave'))) candidates.push({ browser: 'Brave', weight: 95, source: 'Client Hints 品牌标识' });
                    if (brandsLower.some(b => b.includes('opera'))) candidates.push({ browser: 'Opera', weight: 95, source: 'Client Hints 品牌标识' });
                }
                if (realBrowserEvidence.isV8Stack && !realBrowserEvidence.isSpiderMonkeyStack) candidates.push({ browser: 'Chromium 系 (V8引擎)', weight: 80, source: 'JS 报错堆栈格式 (V8)' });
                if (realBrowserEvidence.isSpiderMonkeyStack && !realBrowserEvidence.isV8Stack) candidates.push({ browser: 'Firefox 系 (SpiderMonkey引擎)', weight: 85, source: 'JS 报错堆栈格式 (SpiderMonkey)' });
                if (realBrowserEvidence.hasChromeObject) candidates.push({ browser: 'Chromium 系', weight: 60, source: 'window.chrome 对象存在' });
                if (realBrowserEvidence.hasGeckoCSS && !realBrowserEvidence.hasChromeObject) candidates.push({ browser: 'Firefox 系 (Gecko渲染)', weight: 75, source: 'Gecko 私有 CSS 特性' });
                if (realBrowserEvidence.hasSoftwareRenderer) candidates.push({ browser: 'Headless Chrome (软件渲染)', weight: 70, source: 'WebGL 软件渲染器: ' + realBrowserEvidence.rendererDetail });
                if (realBrowserEvidence.isWebdriver) candidates.push({ browser: '自动化控制浏览器', weight: 90, source: 'navigator.webdriver = true' });

                if (candidates.length === 0) {
                    if (claimed === 'safari') return { browser: 'Safari (或 WebKit 系)', confidence: 'low', note: '无明确底层特征，依据 UA 判断' };
                    if (claimed === 'firefox') return { browser: 'Firefox', confidence: 'low', note: '无明确底层特征，依据 UA 判断' };
                    if (claimed === 'chrome') return { browser: 'Chrome / Chromium 系', confidence: 'low', note: '无明确底层特征，依据 UA 判断' };
                    if (claimed === 'edge') return { browser: 'Edge', confidence: 'low', note: '无明确底层特征，依据 UA 判断' };
                    return { browser: '未知浏览器', confidence: 'low', note: '无法从底层特征确定真实浏览器' };
                }
                candidates.sort((a, b) => b.weight - a.weight);
                const top = candidates[0];
                const highWeightCandidates = candidates.filter(c => c.weight >= 75);
                if (highWeightCandidates.length >= 2) {
                    const browsers = [...new Set(highWeightCandidates.map(c => c.browser))];
                    if (browsers.length >= 2) {
                        return { browser: top.browser, confidence: 'medium', note: '多个底层特征指向不同方向，取最可信证据: ' + top.source };
                    }
                }
                return { browser: top.browser, confidence: top.weight >= 85 ? 'high' : 'medium', note: '依据: ' + top.source };
            }

            function runCoreDetection() {
                results = [];
                realBrowserEvidence = { hasChromeObject: false, hasGeckoCSS: false, isV8Stack: false, isSpiderMonkeyStack: false, clientHintsBrands: [], clientHintsPlatform: '', hasSoftwareRenderer: false, isWebdriver: false, rendererDetail: '' };

                const ua = navigator.userAgent;
                const uaLower = ua.toLowerCase();

                // 声明身份解析 (已修复 EdgA)
                let claimed = 'unknown';
                if (uaLower.includes('edg/') || uaLower.includes('edga/')) claimed = 'edge';
                else if (uaLower.includes('chrome/') || uaLower.includes('crios/')) claimed = 'chrome';
                else if (uaLower.includes('firefox/') || uaLower.includes('fxios/')) claimed = 'firefox';
                else if (uaLower.includes('safari/') && !uaLower.includes('chrome/')) claimed = 'safari';

                // 移动端识别
                const isMobile = /android|iphone|ipad|ipod|webos|blackberry|iemobile|opera mini|mobile/i.test(uaLower);

                // 操作系统解析
                let uaOS = 'unknown';
                if (/windows nt/i.test(uaLower)) uaOS = 'windows';
                else if (/mac os x|macintosh/i.test(uaLower)) uaOS = 'macos';
                else if (/android/i.test(uaLower)) uaOS = 'android';
                else if (/iphone|ipad|ipod/i.test(uaLower)) uaOS = 'ios';
                else if (/cros/i.test(uaLower)) uaOS = 'chromeos';
                else if (/linux/i.test(uaLower)) uaOS = 'linux';

                // ==========================================
                // 1. 深度引擎特征 (移动端 window.chrome 特殊处理)
                // ==========================================
                const isChromium = !!window.chrome;
                const isGecko = typeof CSS !== 'undefined' && CSS.supports && CSS.supports('-moz-appearance', 'none');
                realBrowserEvidence.hasChromeObject = isChromium;
                realBrowserEvidence.hasGeckoCSS = isGecko;

                if (claimed === 'chrome' || claimed === 'edge') {
                    if (!isChromium) {
                        if (isMobile) {
                            addResult('深度引擎特征', 'window.chrome 验证', '缺失 (移动端常见)', 'info',
                                '移动端 Chromium 或 WebView 常不暴露 window.chrome 对象，属正常现象');
                        } else {
                            addResult('深度引擎特征', 'window.chrome 验证', '缺失 ❌', 'fail',
                                '桌面端 UA 声明为 Chromium 但缺失核心对象，极可能是伪装');
                        }
                    } else {
                        addResult('深度引擎特征', 'window.chrome 验证', '存在 ✅', 'pass', '符合 Chromium 特征');
                    }
                    if (isGecko) addResult('深度引擎特征', '渲染特征冲突', '检测到 Gecko ⚠️', 'fail',
                        'UA 声明为 Chromium 但底层渲染器为 Firefox！');
                } else if (claimed === 'firefox') {
                    addResult('深度引擎特征', 'Gecko 渲染验证', isGecko ? '匹配 ✅' : '缺失 ❌', isGecko ? 'pass' : 'fail',
                        isGecko ? '符合 Firefox 特征' : '缺失 Firefox 私有 CSS 特性！');
                    if (isChromium) addResult('深度引擎特征', '渲染特征冲突', '检测到 Chromium ⚠️', 'fail',
                        'UA 声明为 Firefox 但底层暴露了 window.chrome！');
                }

                // JS 引擎堆栈
                try { throw new Error('test'); } catch (e) {
                    const stack = e.stack || '';
                    const isV8 = stack.includes('Error: test\n    at');
                    const isSpider = stack.includes('@') && !stack.includes('    at ');
                    realBrowserEvidence.isV8Stack = isV8;
                    realBrowserEvidence.isSpiderMonkeyStack = isSpider;
                    if (claimed === 'chrome' || claimed === 'edge') {
                        addResult('深度引擎特征', 'JS 引擎堆栈 (V8)', isV8 ? '匹配 ✅' : '不匹配 ❌', isV8 ? 'pass' : 'fail',
                            isV8 ? '底层使用 V8 引擎' : '报错格式不是 V8 引擎，UA 被篡改！');
                    } else if (claimed === 'firefox') {
                        addResult('深度引擎特征', 'JS 引擎堆栈 (SpiderMonkey)', isSpider ? '匹配 ✅' : '不匹配 ❌', isSpider ? 'pass' : 'fail',
                            isSpider ? '底层使用 SpiderMonkey' : '报错格式不是 Firefox 引擎，UA 被篡改！');
                    }
                }

                // ==========================================
                // 2. Client Hints API
                // ==========================================
                if (navigator.userAgentData && navigator.userAgentData.brands) {
                    const brands = navigator.userAgentData.brands;
                    realBrowserEvidence.clientHintsBrands = brands.map(b => b.brand);
                    if (navigator.userAgentData.platform) realBrowserEvidence.clientHintsPlatform = navigator.userAgentData.platform;
                    const brandsLower = brands.map(b => b.brand.toLowerCase());
                    const hasEdge = brandsLower.some(b => b.includes('edge'));
                    const hasChrome = brandsLower.some(b => b.includes('google chrome'));
                    if (claimed === 'edge') {
                        addResult('Client Hints API', '品牌一致性 (Edge)', hasEdge ? '一致 ✅' : '缺失 ⚠️', hasEdge ? 'pass' : 'fail',
                            hasEdge ? '底层品牌承认是 Edge' : '声明为 Edge 但底层 API 未暴露 Edge 品牌');
                    } else if (claimed === 'chrome') {
                        addResult('Client Hints API', '品牌一致性 (Chrome)', !hasEdge ? '一致 ✅' : '冲突 ⚠️', !hasEdge ? 'pass' : 'fail',
                            !hasEdge ? '纯正 Chrome' : '声明为纯 Chrome，但底层 API 暴露出 Edge 品牌');
                    }
                    addResult('Client Hints API', 'API 状态', '原生支持 ✅', 'pass', '正常返回 userAgentData');
                } else {
                    const match = uaLower.match(/(chrome|edge|edg[a]?)\/(\d+)/);
                    if (match && parseInt(match[2]) > 100 && window.isSecureContext) {
                        addResult('Client Hints API', 'API 状态', '异常缺失 ❌', 'fail', '新版 Chromium 在 HTTPS 下理应支持此 API，可能被屏蔽。');
                    } else {
                        addResult('Client Hints API', 'API 状态', '未启用/不支持', 'info', 'Firefox / Safari 或 HTTP 协议下不支持是正常的。');
                    }
                }

                // ==========================================
                // 3. 自动化与无头浏览器检测
                // ==========================================
                const isWebdriver = !!navigator.webdriver;
                realBrowserEvidence.isWebdriver = isWebdriver;
                addResult('自动化特征', 'navigator.webdriver', isWebdriver ? '已开启 ⚠️' : '未开启 ✅', isWebdriver ? 'fail' : 'pass',
                    isWebdriver ? '被自动化框架控制！' : '未开启原生自动化标志');

                const automationIndicators = [
                    { key: '$cdc_asdjflasutopfhvcZLmcfl_', label: 'Selenium CDC' },
                    { key: '__webdriver_evaluate', label: 'WebDriver Evaluate' },
                    { key: 'domAutomation', label: 'domAutomation' },
                    { key: 'Buffer', label: 'Node.js Buffer' },
                ];
                let detectedAutomation = [];
                automationIndicators.forEach(ind => { if (window[ind.key] || document[ind.key]) detectedAutomation.push(ind); });
                if (detectedAutomation.length > 0) {
                    addResult('自动化特征', '框架注入变量', detectedAutomation.map(d=>d.label).join('、'), 'fail', '检测到自动化框架注入的特征变量');
                }

                // WebGL 检测 (软件渲染 + 操作系统渲染指纹)
                try {
                    const gl = document.createElement('canvas').getContext('webgl');
                    if (gl) {
                        const ext = gl.getExtension('WEBGL_debug_renderer_info');
                        const renderer = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : '';
                        realBrowserEvidence.rendererDetail = renderer;
                        const isSoftware = /swiftshader|llvmpipe|mesa\b|virtualbox|basic render|google swiftshader|angle\s*\(?software|chromium\s*canvas/i.test(renderer);
                        realBrowserEvidence.hasSoftwareRenderer = isSoftware;
                        addResult('自动化特征', 'WebGL 渲染器', renderer || '获取失败', isSoftware ? 'warn' : 'pass',
                            isSoftware ? '使用软件渲染，极大概率是无头浏览器' : '硬件加速正常 (' + renderer + ')');

                        if (renderer) {
                            const isWindowsRenderer = /direct3d|directx|d3d|angel.*d3d|nvidia.*d3d|amd.*d3d|intel.*d3d/i.test(renderer);
                            const isLinuxRenderer = /mesa|llvmpipe|nouveau|open source|intel.*mesa|amd.*mesa/i.test(renderer);
                            if (uaOS === 'linux' && isWindowsRenderer) {
                                addResult('操作系统一致性', 'WebGL 渲染指纹', 'Linux UA 但渲染器含 Windows 特征', 'fail',
                                    `渲染器 "${renderer}" 明确指向 Windows (Direct3D)，但 UA 声称 Linux — 明显伪装`);
                            } else if (uaOS === 'windows' && isLinuxRenderer) {
                                addResult('操作系统一致性', 'WebGL 渲染指纹', 'Windows UA 但渲染器含 Linux 特征', 'warn',
                                    `渲染器 "${renderer}" 指向 Linux (Mesa/OpenGL)，与 UA 不符`);
                            }
                        }
                    }
                } catch (e) {}

                // ==========================================
                // 4. 无头浏览器专项检测 (移动端尺寸跳过)
                // ==========================================
                if (!isMobile) {
                    if (window.outerWidth === 0 && window.outerHeight === 0) {
                        addResult('无头浏览器特征', '窗口外框尺寸', '0×0', 'fail', '桌面端窗口外框尺寸为 0，高度疑似无头浏览器！');
                    } else {
                        addResult('无头浏览器特征', '窗口外框尺寸', outerWidth+'×'+outerHeight, 'pass', '窗口外框尺寸正常');
                    }
                }

                if (screen.width === 0 || screen.height === 0) {
                    addResult('无头浏览器特征', '屏幕分辨率', screen.width+'×'+screen.height, 'fail', '屏幕分辨率为 0，极度异常！');
                } else {
                    addResult('无头浏览器特征', '屏幕分辨率', screen.width+'×'+screen.height, 'pass', '屏幕分辨率正常');
                }

                if (screen.width > 0 && screen.height > 0) {
                    if (screen.width === window.innerWidth && screen.height === window.innerHeight) {
                        addResult('无头浏览器特征', '屏幕与视口一致性',
                            '屏幕:'+screen.width+'×'+screen.height+' / 视口:'+innerWidth+'×'+innerHeight,
                            'warn', '屏幕尺寸与视口完全一致，可能为无头环境');
                    } else if (window.innerWidth > screen.width || window.innerHeight > screen.height) {
                        addResult('无头浏览器特征', '屏幕与视口一致性',
                            '屏幕:'+screen.width+'×'+screen.height+' / 视口:'+innerWidth+'×'+innerHeight,
                            'fail', '视口尺寸超过屏幕物理尺寸，严重异常！');
                    } else {
                        addResult('无头浏览器特征', '屏幕与视口一致性',
                            '屏幕:'+screen.width+'×'+screen.height+' / 视口:'+innerWidth+'×'+innerHeight,
                            'pass', '尺寸差异正常');
                    }
                }

                if (screen.colorDepth === 0) {
                    addResult('无头浏览器特征', '色彩深度', screen.colorDepth+' bit', 'fail', '色彩深度为 0，无头浏览器特征！');
                } else {
                    addResult('无头浏览器特征', '色彩深度', screen.colorDepth+' bit', 'pass', '色彩深度正常');
                }

                // ==========================================
                // 5. 操作系统一致性
                // ==========================================
                const osLabels = { windows:'Windows', macos:'macOS', linux:'Linux', android:'Android', ios:'iOS', chromeos:'ChromeOS', unknown:'未知' };
                let platformOS = 'unknown';
                const pl = (navigator.platform || '').toLowerCase();
                if (pl.startsWith('win')) platformOS = 'windows';
                else if (pl.startsWith('mac')) platformOS = 'macos';
                else if (pl.startsWith('iphone') || pl.startsWith('ipad')) platformOS = 'ios';
                else if (pl === 'linux' || pl.startsWith('linux')) platformOS = 'linux';

                let osMismatch = false;
                if (uaOS === 'windows' && platformOS !== 'windows') osMismatch = true;
                if (uaOS === 'macos' && platformOS !== 'macos') osMismatch = true;
                if (uaOS === 'linux' && platformOS !== 'linux') osMismatch = true;
                if (uaOS === 'android' && platformOS !== 'linux') osMismatch = true;
                if (uaOS === 'ios' && platformOS !== 'ios') osMismatch = true;

                addResult('操作系统一致性', 'UA 与平台交叉验证',
                    'UA: '+osLabels[uaOS]+' / Platform: '+osLabels[platformOS]+' ('+(navigator.platform||'?')+')',
                    osMismatch ? 'fail' : 'pass',
                    osMismatch ? 'UA 声明的系统与 navigator.platform 不一致，操作系统可能被伪造！' : 'UA 与平台信息一致');

                if (navigator.userAgentData && navigator.userAgentData.platform) {
                    const uadPlatform = navigator.userAgentData.platform.toLowerCase();
                    let uadOS = 'unknown';
                    if (uadPlatform === 'windows') uadOS = 'windows';
                    else if (uadPlatform === 'macos') uadOS = 'macos';
                    else if (uadPlatform === 'linux') uadOS = 'linux';
                    else if (uadPlatform === 'android') uadOS = 'android';
                    else if (uadPlatform === 'chromeos') uadOS = 'chromeos';
                    let uadMismatch = (uaOS !== uadOS);
                    if (uaOS === 'android' && uadOS === 'android') uadMismatch = false;
                    if (uaOS === 'chromeos' && uadOS === 'chromeos') uadMismatch = false;
                    addResult('操作系统一致性', 'Client Hints 平台验证',
                        'CH Platform: '+navigator.userAgentData.platform+' / UA: '+osLabels[uaOS],
                        uadMismatch ? 'fail' : 'pass',
                        uadMismatch ? 'Client Hints 平台与 UA 声明的系统不一致！' : 'Client Hints 平台与 UA 一致');
                }

                if (claimed === 'firefox' && navigator.oscpu) {
                    const oscpu = navigator.oscpu.toLowerCase();
                    let oscpuOS = 'unknown';
                    if (oscpu.includes('windows')) oscpuOS = 'windows';
                    else if (oscpu.includes('mac')) oscpuOS = 'macos';
                    else if (oscpu.includes('linux')) oscpuOS = 'linux';
                    let oscpuMismatch = false;
                    if (uaOS === 'windows' && oscpuOS !== 'windows') oscpuMismatch = true;
                    if (uaOS === 'macos' && oscpuOS !== 'macos') oscpuMismatch = true;
                    if (uaOS === 'linux' && oscpuOS !== 'linux') oscpuMismatch = true;
                    addResult('操作系统一致性', 'Firefox oscpu 验证',
                        'oscpu: '+navigator.oscpu+' / UA: '+osLabels[uaOS],
                        oscpuMismatch ? 'fail' : 'pass',
                        oscpuMismatch ? 'navigator.oscpu 与 UA 声明的系统不一致！' : 'oscpu 与 UA 一致');
                }

                // 字体探测
                if (uaOS === 'linux') {
                    const hasWindowsFont = document.fonts.check('12px "Calibri"') || document.fonts.check('12px "Segoe UI"');
                    if (hasWindowsFont) addResult('操作系统一致性', '字体探测', '声称 Linux 但检测到 Windows 专属字体', 'warn',
                        '系统中存在 Calibri 或 Segoe UI，可能为 Windows 伪装');
                }

                // ==========================================
                // 6. 浏览器版本探测 (支持 EdgA)
                // ==========================================
                if (claimed === 'chrome' || claimed === 'edge' || claimed === 'firefox') {
                    let match;
                    if (claimed === 'firefox') match = uaLower.match(/firefox\/(\d+)/);
                    else if (claimed === 'edge') match = uaLower.match(/edg[a]?\/(\d+)/);
                    else match = uaLower.match(/chrome\/(\d+)/);
                    const claimedVersion = match ? parseInt(match[1]) : 0;
                    if (claimedVersion > 0) {
                        let probes = [];
                        if (claimed === 'firefox') {
                            probes = [
                                { ver: 90, feat: 'Array.at', check: () => isNativeSupport(Array.prototype, 'at') },
                                { ver: 94, feat: 'structuredClone', check: () => isNativeSupport(window, 'structuredClone') },
                            ];
                        } else {
                            probes = [
                                { ver: 92, feat: 'Array.at', check: () => isNativeSupport(Array.prototype, 'at') },
                                { ver: 98, feat: 'structuredClone', check: () => isNativeSupport(window, 'structuredClone') },
                            ];
                        }
                        let missingOld = [], unexpectedNew = [];
                        probes.forEach(p => {
                            const has = p.check();
                            if (claimedVersion >= p.ver && !has) missingOld.push(p.feat);
                            if (claimedVersion < p.ver && has) unexpectedNew.push(p.feat);
                        });
                        const browserName = claimed === 'firefox' ? 'Firefox' : (claimed === 'edge' ? 'Edge' : 'Chrome');
                        if (missingOld.length > 0) {
                            addResult('浏览器版本探测', browserName + ' 内核老化',
                                '声称 v'+claimedVersion+'，缺失特性', 'fail',
                                '缺失：'+missingOld.join('、')+'，真实内核版本可能较低');
                        } else if (unexpectedNew.length > 0) {
                            addResult('浏览器版本探测', browserName + ' 内核超前',
                                '声称 v'+claimedVersion+'，暴露超前特性', 'fail',
                                '存在：'+unexpectedNew.join('、')+'，真实内核版本可能更高');
                        } else {
                            addResult('浏览器版本探测', browserName + ' 版本特征',
                                'v'+claimedVersion+' 特征吻合', 'pass', 'API 原生支持与版本号匹配');
                        }
                    }
                }

                // ==========================================
                // 系统硬件信息 + 内存API一致性判断 (Firefox 特殊性)
                // ==========================================
                const memory = navigator.deviceMemory;
                addResult('系统硬件信息', '逻辑核心 / 内存',
                    (navigator.hardwareConcurrency || '?')+' 核 / '+(memory || '?')+' GB',
                    'info', '反映设备真实物理性能');

                // 内存API暴露判断：Firefox 默认隐藏 deviceMemory
                if (claimed === 'firefox' && memory !== undefined) {
                    addResult('环境一致性', '内存API暴露', 'Firefox 不应暴露 deviceMemory', 'fail',
                        '标准 Firefox 隐藏此API，当前UA声称为Firefox却暴露内存信息，极可能是Chromium伪装');
                } else if ((claimed === 'chrome' || claimed === 'edge') && !isMobile && memory === undefined) {
                    addResult('环境一致性', '内存API缺失', '桌面 Chromium 缺失 deviceMemory', 'warn',
                        '桌面端Chrome/Edge通常支持此API，缺失可能是Firefox伪装或特殊隐私配置');
                }

                const inference = inferRealBrowser(claimed, ua);
                const claimNames = { chrome: 'Chrome', edge: 'Edge', firefox: 'Firefox', safari: 'Safari', unknown: '未知' };
                const confidenceLabels = { high: '高 ✅', medium: '中 ⚠️', low: '低 ⚠️' };

                let evidenceLines = [];
                if (realBrowserEvidence.clientHintsBrands.length > 0) evidenceLines.push('• Client Hints 品牌: ' + realBrowserEvidence.clientHintsBrands.join(', '));
                if (realBrowserEvidence.clientHintsPlatform) evidenceLines.push('• CH 平台: ' + realBrowserEvidence.clientHintsPlatform);
                if (realBrowserEvidence.isV8Stack) evidenceLines.push('• JS 引擎: V8');
                if (realBrowserEvidence.isSpiderMonkeyStack) evidenceLines.push('• JS 引擎: SpiderMonkey');
                if (realBrowserEvidence.hasChromeObject) evidenceLines.push('• window.chrome 对象: 存在');
                if (realBrowserEvidence.hasGeckoCSS) evidenceLines.push('• Gecko CSS 特性: 存在');
                if (realBrowserEvidence.hasSoftwareRenderer) evidenceLines.push('• WebGL 渲染: 软件渲染 (' + realBrowserEvidence.rendererDetail + ')');
                if (realBrowserEvidence.isWebdriver) evidenceLines.push('• navigator.webdriver: true');

                const claimKey = claimed;
                const inferredBrowserLower = inference.browser.toLowerCase();
                const isMismatch =
                    (claimKey === 'chrome' && !inferredBrowserLower.includes('chrome') && !inferredBrowserLower.includes('chromium')) ||
                    (claimKey === 'edge' && !inferredBrowserLower.includes('edge')) ||
                    (claimKey === 'firefox' && !inferredBrowserLower.includes('firefox') && !inferredBrowserLower.includes('gecko')) ||
                    (claimKey === 'safari' && !inferredBrowserLower.includes('safari') && !inferredBrowserLower.includes('webkit'));

                inferenceData = { claimed, inference, evidenceLines, isMismatch };

                return { claimed, ua, uaLower, isMobile, realBrowserInference: inference };
            }

            function initInteractionTracking() {
                const updateInteraction = () => {
                    let score = (interactData.mouse?1:0)+(interactData.click?1:0)+(interactData.scroll?1:0);
                    let status = score >= 1 ? 'pass' : 'warn';
                    let text = `鼠标:${interactData.mouse?'✅':'⏳'} 点击:${interactData.click?'✅':'⏳'} 滚动:${interactData.scroll?'✅':'⏳'}`;
                    let existing = results.find(r => r.name === '人机交互轨迹');
                    if (existing) { existing.value = text; existing.status = status; existing.reason = score >= 1 ? '捕捉到真实物理交互' : '页面静止，等待交互...'; }
                    else addResult('行为分析', '人机交互轨迹', text, status, '页面静止，等待交互...');
                    renderUI();
                };
                window.addEventListener('mousemove', () => { interactData.mouse = true; updateInteraction(); }, {once: true});
                window.addEventListener('click', () => { interactData.click = true; updateInteraction(); }, {once: true});
                window.addEventListener('scroll', () => { interactData.scroll = true; updateInteraction(); }, {once: true});
                updateInteraction();
            }

            let detectionMeta = null;
            function renderUI() {
                const grid = document.getElementById('detectionGrid');
                grid.innerHTML = '';
                const categories = {};
                results.forEach(r => { if (!categories[r.category]) categories[r.category] = []; categories[r.category].push(r); });
                const fails = results.filter(r => r.status === 'fail' && r.category !== '浏览器身份推断').length;
                const warns = results.filter(r => r.status === 'warn' && r.category !== '浏览器身份推断').length;

                if (detectionMeta) {
                    const claimName = detectionMeta.claimed.charAt(0).toUpperCase()+detectionMeta.claimed.slice(1);
                    document.getElementById('uaClaimedTag').textContent = `🏷️ UA 声明: ${claimName}`;
                    document.getElementById('uaFullString').textContent = detectionMeta.ua;
                }

                const summary = document.getElementById('summaryArea');
                if (detectionMeta && detectionMeta.realBrowserInference) {
                    const inference = detectionMeta.realBrowserInference;
                    const realBrowser = inference.browser;
                    const isDisguised = (detectionMeta.claimed === 'chrome' && realBrowser.includes('Edge')) ||
                                       (detectionMeta.claimed === 'edge' && realBrowser.includes('Chrome') && !realBrowser.includes('Edge'));
                    if (fails > 0 || isDisguised) {
                        summary.style.backgroundColor = '#7f1d1d';
                        summary.innerHTML = `<div class="verdict"><span class="emoji">🚫</span> 风险极高：检测到浏览器身份或操作系统伪装</div>
                        <div class="detail-row"><span>发现 <b>${fails}</b> 项致命异常</span>${warns>0?`<span class="sep">|</span><span><b>${warns}</b> 项警告</span>`:''}<span class="sep">|</span><span>🔍 真实浏览器：<span class="highlight-real">${realBrowser}</span></span></div>`;
                    } else if (warns > 0) {
                        summary.style.backgroundColor = '#b8860b';
                        summary.innerHTML = `<div class="verdict"><span class="emoji">⚠️</span> 环境可疑：存在可疑特征</div>
                        <div class="detail-row"><span>发现 <b>${warns}</b> 项警告</span><span class="sep">|</span><span>真实浏览器：<span class="highlight-real">${realBrowser}</span></span></div>`;
                    } else {
                        summary.style.backgroundColor = '#065f46';
                        summary.innerHTML = `<div class="verdict"><span class="emoji">✅</span> 环境安全：未发现任何篡改痕迹</div>
                        <div class="detail-row"><span>真实浏览器：<span class="highlight-real">${realBrowser}</span></span></div>`;
                    }
                }

                for (let [cat, items] of Object.entries(categories)) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `<div class="card-header">${cat}</div><div class="card-body"><table>${items.map(item => `<tr><td>${item.name}</td><td><span class="badge ${item.status}">${item.status.toUpperCase()}</span><br><strong>${item.value.replace(/\n/g, '<br>')}</strong>${item.reason ? `<span class="reason">${item.reason}</span>` : ''}</td></tr>`).join('')}</table></div>`;
                    grid.appendChild(card);
                }
            }

            function setupUACopy() {
                const uaEl = document.getElementById('uaFullString');
                const toast = document.getElementById('uaToast');
                uaEl.addEventListener('click', () => {
                    const text = uaEl.textContent;
                    if (!text || text === '读取中...') return;
                    navigator.clipboard.writeText(text).then(() => {
                        toast.classList.add('show');
                        setTimeout(() => toast.classList.remove('show'), 1800);
                    }).catch(() => {});
                });
            }

            detectionMeta = runCoreDetection();
            initInteractionTracking();

            if (inferenceData) {
                const { claimed, inference, evidenceLines, isMismatch } = inferenceData;
                const claimNames = { chrome: 'Chrome', edge: 'Edge', firefox: 'Firefox', safari: 'Safari', unknown: '未知' };
                const confidenceLabels = { high: '高 ✅', medium: '中 ⚠️', low: '低 ⚠️' };
                addResult('浏览器身份推断', 'UA 声明身份', claimNames[claimed] || claimed, 'info', 'User-Agent 字符串中声明的浏览器身份');
                addResult('浏览器身份推断', '真实浏览器', inference.browser + '（可信度: ' + confidenceLabels[inference.confidence] + '）', isMismatch ? 'warn' : 'info', isMismatch ? inference.note : '与 UA 声明一致');
                addResult('浏览器身份推断', '底层证据来源', evidenceLines.join('\n') || '无明确底层特征', 'info', '以上证据用于推断真实浏览器');
            }

            setupUACopy();
            renderUI();
        })();
    </script>
</body>
</html>
